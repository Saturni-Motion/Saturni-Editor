<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturni · Audio Cleaner</title>
<style>
:root{
  --bg:#0b0d12; --side:#0d1016; --card:#12151c; --card2:#191d26; --hover:#1f2430; --line:#232937;
  --text:#e8ebf1; --muted:#8a93a6; --faint:#5d6578;
  --accent:#3d9bff; --accent-h:#5cadff; --accent-soft:rgba(61,155,255,.13);
  --ok:#3ecf8e; --ok-soft:rgba(62,207,142,.12); --bad:#f47174; --bad-soft:rgba(244,113,116,.12);
  --wave:#2b3242; --wave-dim:#1d222d;
  --weak:#a9dcff; --soft:#3d9bff; --medium:#34d399; --strong:#f5c84c;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
svg{display:block}
.hidden{display:none!important}

/* sidebar */
.side{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 18px;border-right:1px solid var(--line);background:var(--side)}
.nav{width:80px;padding:12px 4px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;line-height:1.25;text-align:center;transition:background .15s,color .15s}
.nav svg{width:22px;height:22px}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:linear-gradient(180deg,rgba(90,174,255,.40),rgba(50,144,245,.20));box-shadow:inset 0 1px 0 rgba(255,255,255,.14);color:#fff}
.nav.on svg{color:#e3f0ff}
.gear{margin-top:auto;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.gear svg{width:20px;height:20px}
.gear:hover,.gear.on{color:var(--text)}
.setpop{position:fixed;left:104px;bottom:16px;z-index:50;width:220px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 14px 40px -12px rgba(0,0,0,.85);display:flex;flex-direction:column;gap:10px}
.setpop .row{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;line-height:1}
.setpop .lseg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.setpop .lseg button{height:26px;min-width:40px;line-height:1;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.setpop .lseg button:hover{color:var(--text)}
.setpop .lseg button.on{color:var(--text);box-shadow:inset 0 0 0 1px var(--accent);border-radius:7px}
.setpop .hint{font-size:11.5px;color:var(--muted);opacity:.7;line-height:1.35}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.col.center{margin:auto}
.col.center .head{text-align:center}
.col{width:min(780px,calc(100% - 80px));margin:0 0 0 40px;padding:40px 0 56px;display:flex;flex-direction:column;gap:20px}

/* result: full width */
.res-view{padding:32px 40px 32px}
.r-head{display:flex;align-items:flex-start;gap:16px}
.r-acts{display:flex;flex-direction:column;gap:8px;flex:none}
.r-acts .ghost{width:100%;height:36px;padding:0 14px;border-radius:10px;background:var(--card2);color:var(--text)}
.r-acts .ghost:hover{background:var(--hover)}
.r-acts .menu{top:42px}
.r-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
.r-head .report{margin:12px 0 0;padding:0;border:0}
.bigplay{flex:1;height:56px;border-radius:12px;background:var(--card2);color:var(--text);display:grid;place-items:center;transition:background .15s}
.bigplay:hover{background:var(--hover)}
.bigplay svg{width:28px;height:28px}
.tracks{margin-top:24px;display:flex;flex-direction:column;gap:18px}
.trk{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;align-items:center}
.trk-head{display:flex;align-items:center;gap:2px;min-width:0}
.tname{height:30px;padding:0 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border-radius:14px;font-size:13px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.tname:hover{color:var(--text);background:var(--hover)}
.tname.on{color:var(--text);background:linear-gradient(180deg,#222835,#191d26);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.trk-body{position:relative;height:88px;border-radius:12px;background:#0f1218;overflow:hidden;cursor:text;touch-action:none}
.trk-body.panning{cursor:grabbing!important}
.trk-body canvas{position:absolute;inset:0;width:100%;height:100%}
.bottom{flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 40px 14px}
.bottom .bigplay{width:100%;flex:none}
.bigtime{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bigtime span{color:var(--faint);font-weight:500}
.hint2{font-size:12px;color:var(--faint);text-align:center;margin-top:18px}
.head h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.head p{color:var(--muted);font-size:13px;margin-top:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.row{display:flex;align-items:center;gap:14px;min-width:0}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-weight:600}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{height:44px;border-radius:10px;background:linear-gradient(180deg,#5aaeff,#3d9bff 60%,#3290f5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);color:#fff;font-weight:600;padding:0 22px;transition:background .15s,opacity .15s}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#72baff,#55aaff 60%,#4199f7)}
.btn:disabled{background:var(--card2);color:var(--faint);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{height:34px;padding:0 16px;font-size:13px;border-radius:9px}
.ghost{height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ghost:hover{background:var(--hover);color:var(--text)}
.ghost svg{width:15px;height:15px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover:not(:disabled){background:var(--hover);color:var(--text)}
.ib:disabled{opacity:.3}
.ib svg{width:16px;height:16px}
.ib.round{width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,#5aaeff,#3d9bff 60%,#3290f5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);color:#fff}
.ib.round:hover{background:linear-gradient(180deg,#72baff,#55aaff 60%,#4199f7)}
.ib.round svg{width:22px;height:22px}

/* drop zone */
.drop{border:2px solid transparent;--crisp-dash:#2c3343;border-radius:var(--r);height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;transition:.15s}
body.dragging .drop{--crisp-dash:var(--accent);background:var(--accent-soft)}
.drop .ico{width:48px;height:48px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--accent)}
.drop .ico svg{width:24px;height:24px}
.drop h2{font-size:17px;font-weight:600}
.drop p{color:var(--muted);font-size:13px;margin-top:4px}

canvas.wave{width:100%;height:44px;cursor:pointer;display:block}

/* lens segmented control: no frame, a droplet slides to the chosen item */
.seg{position:relative;display:inline-flex;gap:2px;isolation:isolate}
.seg button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:16px;color:var(--muted);font-size:13px;white-space:nowrap;transition:color .25s}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--lens-fg,var(--text))}
.seg .lens{position:absolute;z-index:0;top:0;height:32px;border-radius:16px;
  background:var(--lens-bg,var(--card2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.09);
  transition:left .22s cubic-bezier(.4,0,.2,1),width .22s cubic-bezier(.4,0,.2,1),background-color .25s;pointer-events:none}

/* songs */
.songs-head{display:flex;align-items:center;gap:10px;min-height:32px}
.state{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.list{display:flex;flex-direction:column;margin-top:12px}
.song{display:grid;grid-template-columns:36px minmax(0,1fr) auto 32px 32px;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.song:first-child{border-top:0}
.cover{width:36px;height:36px;border-radius:7px;background:var(--card2);object-fit:cover;display:grid;place-items:center;color:var(--faint)}
.cover svg{width:16px;height:16px}
.pill{font-size:12px;height:24px;line-height:24px;padding:0 10px;border-radius:12px;background:var(--card2);color:var(--muted);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{font-size:13px;color:var(--muted);padding:6px 0 2px}
.add{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;gap:8px}
.field{flex:1;position:relative}
.field input{width:100%;height:36px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 12px 0 34px;outline:none}
.field input:focus{border-color:var(--accent)}
.field svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--faint)}
.results{border:1px solid var(--line);border-radius:10px;max-height:264px;overflow-y:auto}
.res{display:grid;grid-template-columns:56px minmax(0,1fr) 32px auto;gap:12px;align-items:center;padding:6px 8px 6px 6px;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res img,.res .noimg{width:56px;height:32px;border-radius:5px;object-fit:cover;background:var(--card2)}
.res .t{font-size:13px}
.addbtn{height:28px;padding:0 10px;border-radius:7px;background:linear-gradient(180deg,rgba(61,155,255,.22),rgba(61,155,255,.09));color:var(--accent);font-size:12.5px;font-weight:600}
.addbtn:hover{background:linear-gradient(180deg,rgba(61,155,255,.32),rgba(61,155,255,.15))}
.res-msg{padding:10px 12px;font-size:13px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);cursor:pointer}
.sw{width:32px;height:18px;border-radius:9px;background:#2a3040;position:relative;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.check.on .sw{background:linear-gradient(180deg,#5aaeff,#3290f5)}
.check.on .sw::after{left:16px}

/* progress */
.bar{height:4px;border-radius:2px;background:var(--card2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc2ff,#3d9bff);transition:width .4s}
.err{color:var(--bad)}

/* results */
.report{display:flex;flex-direction:column;gap:6px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.report div{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.report b{color:var(--text);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;transform:translateY(-1px)}
.dot.warn{background:#e0a43a}
.transport{display:flex;align-items:center;gap:14px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;margin-top:2px}
.tune{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;margin-top:18px}
.scope{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.scope .sw-dot{width:10px;height:10px;border-radius:50%;flex:none}
.scope .x{width:22px;height:22px;border-radius:6px;color:var(--faint);display:grid;place-items:center}
.scope .x:hover{background:var(--hover);color:var(--text)}
.scope .x svg{width:12px;height:12px}
.grid3{display:grid;grid-template-columns:150px minmax(0,1fr) 100px;align-items:center;gap:16px}
.lane-row{margin-top:16px}
.lane{position:relative;height:30px;border-radius:8px;background:var(--card2);cursor:crosshair;overflow:hidden;touch-action:none}
.lane .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--faint);pointer-events:none;padding:0 8px;text-align:center}
.lane .cursor{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);pointer-events:none}
.reg{position:absolute;top:3px;bottom:3px;border-radius:6px;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#0b0d12;overflow:hidden;white-space:nowrap}
.reg.sel{box-shadow:0 0 0 2px #fff}
.reg .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.reg .h.l{left:0}.reg .h.r{right:0}
.stem{padding:14px 0;border-top:1px solid var(--line)}
.stems-wrap{margin-top:12px}
.stem .name{font-size:13.5px;font-weight:500}
.ctl{display:flex;gap:2px;align-items:center;justify-content:flex-end}
.tg{width:28px;height:28px;border-radius:7px;font-size:11px;font-weight:700;color:var(--faint)}
.tg:hover{background:var(--hover);color:var(--text)}
.tg.on.m{background:var(--bad-soft);color:var(--bad)}
.tg.on.s{background:var(--accent-soft);color:var(--accent)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:36px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:10;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--hover)}
.foot{display:flex;justify-content:center}
.rr{display:flex;align-items:center;gap:10px;justify-self:end;min-width:0}
.rr .time{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rr .btn{flex:none}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262c3a;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:820px){
  .col{width:calc(100% - 48px);margin-left:24px}
  .res-view{padding:24px}
  .bottom{padding:14px 24px 12px}
  .trk{grid-template-columns:170px minmax(0,1fr);gap:8px}
  .grid3{grid-template-columns:120px minmax(0,1fr) 100px;gap:12px}
  .seg button{padding:0 11px}
}
</style>
<link rel="stylesheet" href="/mod/debug/debug.css">
</head>
<body>

<aside class="side">
  <button class="nav" data-mode="speech"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-t="nav_speech"></span></button>
  <button class="nav" data-mode="vocals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-t="nav_vocals"></span></button>
  <button class="nav" data-mode="stems"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><mask id="clefcut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path transform="matrix(1.12 0 0 1.12 -2.3 -1.4)" d="M17.8 20.6 17.2 4.6c-.1-2 2.4-2.8 2.8-1 .5 2.2-1.4 4-3.4 5.6-2.2 1.8-3 3.2-3 5 0 2.2 1.7 3.6 3.8 3.6 2 0 3.4-1.3 3.4-3.2 0-1.7-1.2-2.9-2.8-2.9-1.4 0-2.4.9-2.4 2.2" stroke="#000" stroke-width="5"/></mask><path mask="url(#clefcut)" stroke-width="2.2" d="M2.5 7h16M2.5 12h16M2.5 17h16"/><path transform="matrix(1.12 0 0 1.12 -2.3 -1.4)" stroke-width="1.55" d="M17.8 20.6 17.2 4.6c-.1-2 2.4-2.8 2.8-1 .5 2.2-1.4 4-3.4 5.6-2.2 1.8-3 3.2-3 5 0 2.2 1.7 3.6 3.8 3.6 2 0 3.4-1.3 3.4-3.2 0-1.7-1.2-2.9-2.8-2.9-1.4 0-2.4.9-2.4 2.2"/></svg><span data-t="nav_stems"></span></button>
  <button class="gear" id="gear" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</aside>
<div class="setpop hidden" id="setpop"><div class="row"><span data-t="language"></span><div class="lseg" id="lseg"><button data-l="en">EN</button><button data-l="ru">RU</button></div></div><div class="hint">Ctrl+click the gear: Debug notes</div></div>

<main><div class="scroller" id="scroller"><div class="col" id="col">

  <div class="head"><h1 id="h-title"></h1><p id="h-sub"></p></div>

  <section id="s-drop" class="drop">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></div>
    <div><h2 id="drop-title" data-t="drop_title"></h2><p id="drop-sub" data-t="drop_sub"></p></div>
    <button class="btn" id="pick" data-t="pick"></button>
  </section>
  <input type="file" id="file" class="hidden" accept="audio/*,video/*">

  <section id="s-file" class="card hidden">
    <div class="row">
      <button class="ib round" id="in-play"></button>
      <div class="grow"><div class="title ell" id="f-name"></div><div class="time" id="f-meta"></div></div>
      <button class="ghost" id="f-change" data-t="change"></button>
    </div>
    <canvas class="wave" id="in-wave" style="margin-top:16px"></canvas>
  </section>

  <section id="s-songs" class="card hidden">
    <div class="songs-head">
      <div class="label grow" data-t="songs"></div>
      <div class="state" id="an-state"></div>
      <button class="ghost" id="add-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="add"></span></button>
    </div>
    <div class="list" id="songs"></div>
    <div class="add hidden" id="add">
      <div class="search">
        <div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" data-tp="search_ph" autocomplete="off" spellcheck="false"></div>
        <button class="ghost" id="ref-file" style="height:36px" data-t="own_file"></button>
      </div>

/* ================= lens segmented control ================= */
function Seg(el, items, value, onChange, colored){
  el.innerHTML = `<span class="lens"></span>` + items.map(([v])=>`<button data-v="${v}"></button>`).join("");
  const lens = el.querySelector(".lens");
  const api_ = {
    value,
    labels(){ el.querySelectorAll("button").forEach((b,i)=>b.textContent = t(items[i][1])); this.place(false); },
    set(v, animate=true){
      const prev = this.value; this.value = v;
      el.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
      if(colored){ const c = lvColor(v); el.style.setProperty("--lens-bg", c+"2e"); el.style.setProperty("--lens-fg", c); }
      this.place(animate && prev !== v, prev);
    },
    place(animate, prev){
      const b = el.querySelector(`button[data-v="${this.value}"]`); if(!b || !b.offsetWidth) return;
      const to = {l:b.offsetLeft, w:b.offsetWidth};
      const pb = prev && el.querySelector(`button[data-v="${prev}"]`);
      if(animate && pb){
        // droplet: stretch over both items, then settle on the new one
        const l = Math.min(pb.offsetLeft, to.l), r = Math.max(pb.offsetLeft+pb.offsetWidth, to.l+to.w);
        lens.style.left = l+"px"; lens.style.width = (r-l)+"px";
        clearTimeout(lens._t); lens._t = setTimeout(()=>{   // measure again: labels may have changed meanwhile
          const nb = el.querySelector(`button[data-v="${this.value}"]`);
          lens.style.left = nb.offsetLeft+"px"; lens.style.width = nb.offsetWidth+"px"; }, 170);
      } else {
        clearTimeout(lens._t);
        const tr = lens.style.transition; lens.style.transition = "none";
        lens.style.left = to.l+"px"; lens.style.width = to.w+"px";
        lens.offsetWidth; lens.style.transition = tr;
      }
    }
  };
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.dataset.v!==api_.value){ api_.set(b.dataset.v); onChange(b.dataset.v); } });
  api_.labels(); api_.set(value, false);
  return api_;
}

async function openJob(promise, name){

  $("#drop-title").textContent = t("drop_title"); $("#drop-sub").textContent = t("drop_sub"); $("#pick").classList.remove("hidden");

/* ================= waveform ================= */
function drawWave(cv, peaks, pos, dim, regs){
  const dpr = devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
  if(!w || !peaks) return;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const c = cv.getContext("2d"); c.scale(dpr,dpr);
  const dur = (job && job.duration) || 1;
  for(const r of regs||[]){ c.fillStyle = lvColor(r.level)+"1f"; c.fillRect(r.start/dur*w, 0, (r.end-r.start)/dur*w, h); }
  const step = 3, bars = Math.floor(w/step), n = peaks.length;
  let mx = 0.02; for(const v of peaks) if(v>mx) mx=v;
  const css = getComputedStyle(document.documentElement);
  const played = css.getPropertyValue("--accent").trim(), rest = css.getPropertyValue(dim?"--wave-dim":"--wave").trim();
  for(let i=0;i<bars;i++){
    const a = Math.floor(i*n/bars), b = Math.max(a+1, Math.floor((i+1)*n/bars));
    let v=0; for(let k=a;k<b;k++) if(peaks[k]>v) v=peaks[k];
    const bh = Math.max(2, Math.round((v/mx)*(h-2)));
    c.fillStyle = !dim && i/bars < pos ? played : rest;
    c.fillRect(i*step, Math.round((h-bh)/2), 2, bh);
  }
}

/* ================= songs ================= */
async function analyze(){ if(job){ job.analysis = {status:"running", progress:0, tracks:[]}; await api(`/api/job/${job.id}/analyze`,{method:"POST"}); poll(); } }
function mergeSegs(list){
  const segs = [];
  for(const s of [...(list || [])].sort((a,b)=>a.mix_start-b.mix_start)){
    const last = segs[segs.length-1];
    if(last && s.mix_start < last.mix_end - 0.3) last.mix_end = Math.max(last.mix_end, s.mix_end);
    else segs.push({mix_start:s.mix_start, mix_end:s.mix_end});
  }
  return segs;
}
function found(m){
  const segs = mergeSegs(m && m.segments), tot = segs.reduce((s,x)=>s+x.mix_end-x.mix_start,0);
  return [t("found", segs.length, fmt(tot)), "ok", segs.map(s=>`${fmt(s.mix_start)}–${fmt(s.mix_end)}`).join(", ")];
}
function songRows(){
  const rows = [], an = job && job.analysis;
  for(const tr of (an && an.tracks) || []){
    const m = tr.ref && job.match[tr.ref];
    rows.push({id:"a:"+tr.key, title:tr.title, artist:tr.artist, cover:tr.cover, ref:tr.status==="found"?tr.ref:null,
      state: tr.status==="found" ? found(m) : tr.status==="no_source" ? [t("st_no_source"),"bad"] : [t("st_"+tr.status), "wait"]});
  }
  for(const r of manual){
    const m = job && job.match[r.id];
    let state;
    if(r.status==="downloading") state = [r.progress>0.01 ? t("dl_pct", Math.round(r.progress*100)) : t("st_downloading"),"wait"];
    else if(r.status==="error") state = [tmsg(r.error) || t("dl_fail"),"bad"];
    else if(!job) state = [t("st_ready"),"wait"];
    else if(!m || m.status==="checking") state = [t("st_checking"),"wait"];
    else if(m.status==="found") state = found(m);
    else state = [t("st_notin"),"bad"];
    rows.push({id:"m:"+r.id, title:r.title, artist:t("manual"), cover:null,
      ref: r.status==="ready" && m && m.status==="found" ? r.id : null, playRef: r.status==="ready" ? r.id : null, state});
  }
  return rows.filter(r=>!removed.has(r.id));
}

function poll(){

      for(const r of manual) if(r.status==="downloading"){ Object.assign(r, await api(`/api/refs/${r.id}`)); pending=true; }

/* ================= process / re-render ================= */
async function runJob(isRerender){
  inA.pause(); pv.pause();
  const m = mode==="stems" ? stemMode : mode;
  if(!isRerender) lastRefs = mode==="speech" ? songRows().filter(r=>r.ref).map(r=>r.ref) : [];
  const body = {mode:m, refs:lastRefs, nn_fallback:fallback, strength,
                regions: regions.map(r=>({start:r.start, end:r.end, level:r.level}))};
  try{ await api(`/api/job/${job.id}/process`,{json:body}); }
  catch(err){ alert(err.message); return; }
  const snapshot = JSON.stringify([strength, body.regions]);
  rerendering = !!isRerender;
  job.status = "queued"; job.mode = m;
  if(!rerendering){ $("#p-bar").style.width="0"; $("#p-msg").textContent=tmsg("@queued"); $("#p-msg").classList.remove("err"); $("#p-pct").textContent=""; }
  else { $("#rerender").disabled = true; $("#rr-msg").textContent = t("rerendering"); }
  render();
  const iv = setInterval(async ()=>{
    let j; try{ j = await api(`/api/job/${job.id}`); }catch(e){ return; }
    Object.assign(job, j); job.mode = m;
    if(rerendering) $("#rr-msg").textContent = j.status==="running" ? `${t("rerendering")} ${Math.round(j.progress*100)}%` : t("rerendering");
    else {
      $("#p-msg").textContent = tmsg(j.message); $("#p-msg").classList.toggle("err", j.status==="error");
      $("#p-pct").textContent = j.status==="running" ? Math.round(j.progress*100)+"%" : ""; $("#p-bar").style.width = (j.progress*100)+"%";
    }
    if(j.status==="done"){ clearInterval(iv); rendered = snapshot; const keepT = a0() ? a0().currentTime : 0; rerendering=false; showResult(keepT); }
    if(j.status==="error"){ clearInterval(iv);
      if(rerendering){ rerendering=false; job.status="done"; $("#rr-msg").textContent = tmsg(j.message); updateDirty(); }
      else { job.status="uploaded_err"; render(); $("#s-prog").classList.remove("hidden"); } }
  }, 500);
}

  const now = JSON.stringify([strength, regions.map(r=>({start:r.start, end:r.end, level:r.level}))]);

const dur = () => (job && job.duration) || 1;

/* waveform of one track inside the current zoom window: parts behind, playhead on top */
function roundRect(c, x, y, w, h, r){
  c.beginPath(); if(w <= 0) return; r = Math.min(r, w/2, h/2);
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function drawTrack(p){
  const cv = p.cv, dpr = devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
  if(!w) return;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const c = cv.getContext("2d"); c.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement);
  const played = css.getPropertyValue("--accent").trim(), rest = css.getPropertyValue(p.on?"--wave":"--wave-dim").trim();
  const pos = a0() ? a0().currentTime : 0, span = view.e - view.s;
  if(p.peaks && p.peaks.length){
    const P = p.peaks, pps = P.length / dur();
    if(p.mx === undefined){ let mx = 0.02; for(const v of P) if(v>mx) mx=v; p.mx = mx; }
    const step = 3, bars = Math.floor(w/step);
    for(let i=0;i<bars;i++){
      const t0 = view.s + i*step/w*span, t1 = view.s + (i+1)*step/w*span;
      const a = Math.max(0, Math.floor(t0*pps)), b = Math.min(P.length, Math.max(a+1, Math.ceil(t1*pps)));
      let v=0; for(let k=a;k<b;k++) if(P[k]>v) v=P[k];
      const bh = Math.max(2, Math.round((v/p.mx)*(h-18)));
      c.fillStyle = p.on && t1 <= pos ? played : rest;
      c.fillRect(i*step, Math.round((h-bh)/2), 2, bh);
    }
  }
  if(job.mode==="speech") for(const r of regions){
    const x0 = (r.start-view.s)/span*w, x1 = (r.end-view.s)/span*w;
    if(x1 < 0 || x0 > w) continue;
    const col = lvColor(r.level), sel = r===selReg;
    c.fillStyle = col + (sel ? "33" : "22"); roundRect(c, x0, 6, x1-x0, h-12, 10); c.fill();
    c.strokeStyle = sel ? "#ffffffd9" : col + "b3"; c.lineWidth = sel ? 2 : 1.5;
    roundRect(c, x0+1, 7, x1-x0-2, h-14, 9); c.stroke();
  }
  if(job.mode==="speech") for(const r of regions){        // labels on top of the waveform
    const x0 = (r.start-view.s)/span*w, x1 = (r.end-view.s)/span*w;
    if(x1-x0 > 64 && x1 > 0 && x0 < w){ c.fillStyle = lvColor(r.level); c.font = "600 11px 'Segoe UI', sans-serif"; c.fillText(t(r.level), Math.max(x0, 0)+10, 22); }
  }
  const px = (pos-view.s)/span*w;
  if(px >= 0 && px <= w){ c.fillStyle = "#ffffffd0"; c.fillRect(Math.round(px), 0, 1.5, h); }
}
function drawAll(){
  if(!players.length) return;
  players.forEach(drawTrack);
  $("#t-cur").textContent = fmtT(a0().currentTime);
}
function seek(t_){ players.forEach(p=>p.a.currentTime=t_); drawAll(); }
function play(){ const t_=a0().currentTime; players.forEach(p=>{ p.a.currentTime=t_; p.a.play(); }); setPlayIcon(true); tick(); }
function pause(){ players.forEach(p=>p.a.pause()); setPlayIcon(false); drawAll(); }
function seekPlay(t_){ seek(Math.max(0, Math.min(dur()-0.05, t_))); if(a0().paused) play(); }
$("#m-play").onclick = () => { const m=a0(); if(!m) return; m.paused ? play() : pause(); };
function tick(){
  const m=a0(); if(!m || m.paused) return;
  for(const p of players.slice(1)) if(Math.abs(p.a.currentTime-m.currentTime)>0.06) p.a.currentTime=m.currentTime;
  // when zoomed in, turn the page as the playhead runs off the right edge (but never yank the view
  // away from where the user scrolled to look)
  const span = view.e-view.s, cur = m.currentTime;
  if(span < dur()-0.01 && !drag && tick.prev !== undefined && tick.prev <= view.e && cur > view.e){
    view.s = Math.max(0, Math.min(dur()-span, cur - span*0.05)); view.e = view.s+span; }
  tick.prev = cur;
  drawAll(); requestAnimationFrame(tick);
}
document.addEventListener("keydown", e=>{
  if(window.SaturniDebug && (SaturniDebug.owns(e) || SaturniDebug.active)) return;

function renderReport(){
  const box=$("#report"), rep=job.report;
  if(!rep){ box.classList.add("hidden"); return; }
  const lines = [];
  for(const r of Object.values(rep.refs||{})){
    const n = mergeSegs(r.segments).length;
    const how = r.segments.every(s=>s.spectral) ? t("how_spec") : r.segments.some(s=>s.spectral) ? t("how_mix") : t("how_exact");
    if(n) lines.push(`<div><span class="dot"></span><span><b>${esc(r.title)}</b> — ${how}, ${t("parts_n", n)}</span></div>`);
  }
  for(const u of rep.unknown||[]) lines.push(`<div><span class="dot warn"></span><span>${t("unknown", fmt(u[0]), fmt(u[1]))}</span></div>`);
  box.innerHTML = lines.join(""); box.classList.toggle("hidden", !lines.length);
}

$("#tracks").addEventListener("wheel", e=>{
  if(!job || !players.length) return;
  e.preventDefault();
  const body = e.target.closest(".trk-body") || players[0].body, rect = body.getBoundingClientRect();
  const span = view.e - view.s;
  if(e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)){
    const d = (e.shiftKey ? e.deltaY : e.deltaX) / rect.width * span;
    view.s = Math.max(0, Math.min(dur()-span, view.s + d)); view.e = view.s + span;
  } else {
    const fx = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width)), at = view.s + fx*span;
    const ns = Math.max(Math.min(1.5, dur()), Math.min(dur(), span*Math.exp(e.deltaY*0.0018)));
    view.s = Math.max(0, Math.min(dur()-ns, at - fx*ns)); view.e = view.s + ns;
  }
  drawAll();
}, {passive:false});

/* ================= parts: marked right on the tracks ================= */
function renderScope(){
  const s = $("#scope");
  if(selReg){
    s.innerHTML = `<span class="sw-dot" style="background:${lvColor(selReg.level)}"></span><span class="ell">${t("part", fmt(selReg.start), fmt(selReg.end))}</span>
      <button class="x" title="${t("del_part")}">${ICON.x}</button>`;
    s.querySelector(".x").onclick = () => deleteRegion(selReg);
  } else s.innerHTML = `<span class="sw-dot" style="background:${lvColor(strength)}"></span><span>${t("whole")}</span>`;
}
function selectRegion(r){ selReg = r; segRegion.set(r ? r.level : strength, true); renderScope(); drawAll(); }
function deleteRegion(r){ regions = regions.filter(x=>x!==r); if(selReg===r) selReg=null; selectRegion(selReg); updateDirty(); }
function drawLane(){ drawAll(); }
function hitRegion(p, x){
  const w = p.body.clientWidth, span = view.e-view.s, tt = view.s + x/w*span, edge = 9/w*span;
  for(const r of [...regions].reverse()){
    if(Math.abs(tt-r.start) <= edge) return {r, kind:"l"};
    if(Math.abs(tt-r.end) <= edge) return {r, kind:"r"};
    if(tt > r.start && tt < r.end) return {r, kind:"move"};
  }
  return null;
}
let drag = null;
function bindTrack(p){
  const body = p.body;
  const relX = e => e.clientX - body.getBoundingClientRect().left;
  const toT = e => view.s + Math.max(0, Math.min(1, relX(e)/body.clientWidth))*(view.e-view.s);
  body.addEventListener("contextmenu", e=>e.preventDefault());
  body.addEventListener("pointerdown", e=>{
    if(e.button===2){
      body.setPointerCapture(e.pointerId); body.classList.add("panning");
      drag = {p, pan:true, cx:e.clientX, vs:view.s}; return;
    }
    if(e.button!==0) return;
    body.setPointerCapture(e.pointerId);
    const h = job.mode==="speech" ? hitRegion(p, relX(e)) : null;
    drag = {p, x0:toT(e), cx:e.clientX, moved:false, kind: h ? h.kind : "new", r: h ? h.r : null, s0: h ? h.r.start : 0, e0: h ? h.r.end : 0};
  });
  body.addEventListener("pointermove", e=>{
    if(!drag){
      const h = job.mode==="speech" ? hitRegion(p, relX(e)) : null;
      body.style.cursor = !h ? (job.mode==="speech" ? "text" : "pointer") : h.kind==="move" ? "grab" : "ew-resize";
      return;
    }
    if(drag.p!==p) return;
    if(drag.pan){
      const span = view.e-view.s;
      view.s = Math.max(0, Math.min(dur()-span, drag.vs - (e.clientX-drag.cx)/body.clientWidth*span)); view.e = view.s+span;
      drawAll(); return;
    }
    if(!drag.moved && Math.abs(e.clientX-drag.cx) < 4) return;
    drag.moved = true;
    if(job.mode!=="speech") return;
    const x = toT(e), d = x - drag.x0, D = dur();
    if(drag.kind==="new"){
      if(!drag.r){ drag.r = {start:drag.x0, end:drag.x0, level:lastLevel}; regions.push(drag.r); selReg = drag.r; segRegion.set(lastLevel, true); }
      drag.r.start = Math.min(drag.x0, x); drag.r.end = Math.max(drag.x0, x);
    } else {
      if(selReg!==drag.r){ selReg = drag.r; segRegion.set(drag.r.level, true); }
      if(drag.kind==="move"){ const len = drag.e0-drag.s0, st = Math.min(D-len, Math.max(0, drag.s0+d)); drag.r.start = st; drag.r.end = st+len; }
      else if(drag.kind==="l") drag.r.start = Math.min(drag.r.end-0.2, Math.max(0, drag.s0+d));
      else drag.r.end = Math.max(drag.r.start+0.2, Math.min(D, drag.e0+d));
    }
    renderScope(); drawAll();
  });
  body.addEventListener("pointerup", ()=>{
    if(!drag || drag.p!==p) return;
    const d = drag; drag = null;
    if(d.pan){ body.classList.remove("panning"); return; }
    if(!d.moved){
      // a click anywhere starts playback from there; clicking a part also selects it
      if(job.mode==="speech" && (d.r || selReg)) selectRegion(d.r || null);
      seekPlay(d.x0);
    } else if(d.r && d.r.end - d.r.start < 0.2) deleteRegion(d.r);
    renderScope(); drawAll(); updateDirty();
  });
}

window.addEventListener("resize", ()=>{
  segStrength.place(false); segStems.place(false); segRegion.place(false);
  if(!job) return; if(job.status==="done") drawAll(); else drawWave($("#in-wave"), job.peaks, inA.currentTime/(job.duration||1));
});
applyLang();

addEventListener("pywebviewready", () => { if (window.SaturniDebug) SaturniDebug.init({ api: (n, ...a) => window.pywebview.api[n](...a),
  app: "Saturni · Audio Cleaner", context: () => mode, gear: "#gear" }); });
</script>
