<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saturni · Motion Tracker</title>
<style>
  :root {
    --bg:#141517; --surface:#1c1e21; --surface2:#24262a; --line:rgba(255,255,255,.07); --text:#eceef1; --dim:#878c95;
    --blue:#2f8cff; --blue2:#1f6fe0; --blue-hi:#5aa6ff; --yellow:#ffd23f; --ok:#4fd18b; --warn:#f2b54a; --err:#ff6b61;
    --r:14px; --ease:cubic-bezier(.3,.7,.4,1); --accent:#3d9bff;
    /* switch glass (picked by Saturni in the playground) */
    --h:220; --s:70; --fa:.03; --fb:.04; --rb:.04; --rtl:.02; --rte:.02; --rbr:.02; --shadow:.04;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    display:flex; flex-direction:column; gap:12px; padding:16px 16px 10px; overflow:hidden;
    background:var(--bg); color:var(--text); font:12px/1.35 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-feature-settings:"cv11", "ss01"; -webkit-font-smoothing:antialiased; user-select:none;
  }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:disabled { cursor:default; opacity:.4; }

  /* ---------- primary buttons ---------- */
  .btn {
    position:relative; isolation:isolate; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:8px; min-width:0;
    padding:10px 16px; border-radius:var(--r); border:none; white-space:nowrap;
    font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:14.5px;
    transition:box-shadow .25s var(--ease), transform .25s var(--ease);
  }
  .btn.blue { color:#fff; background:var(--accent); transition:background-color .18s, transform .25s var(--ease); }   /* flat, as Save in Editor */
  .btn.blue:hover:not(:disabled) { background:color-mix(in srgb, var(--accent) 85%, #fff); }
  .btn:active:not(:disabled) { transform:translateY(1px); }
  .btn svg { width:16px; height:16px; flex:none; display:block; }
  .btn span { overflow:hidden; text-overflow:ellipsis; margin-right:-.04em; line-height:16px; position:relative; top:1px; } /* margin: trailing letter-spacing */
  /* PREPARE CLIP lives in the viewer: big in the middle before a clip is loaded,
     small and muted in the top-left corner afterwards (blue again on hover). */
  #btnPrepare {
    position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%, -50%); width:auto; max-width:calc(100% - 24px);
    padding:11px 18px; font-size:16px; gap:9px;
  }
  #btnPrepare svg { width:19px; height:19px; position:relative; top:.5px; }
  #btnPrepare span { line-height:19px; top:0; }
  #btnPrepare.nosel { background:#3a3d43; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); color:#c9ccd1; }
  #viewer.ready #btnPrepare { left:16px; top:16px; transform:none; width:auto; padding:6px 11px; font-size:12px; gap:6px; border-radius:11px; }
  /* corner controls show while the pointer is over the viewer: quickly in, slowly out */
  #viewer.ready #btnPrepare, #viewer.ready #btnClearBox { opacity:0; transition:opacity 1s var(--ease), color .2s var(--ease), box-shadow .25s var(--ease); }
  #viewer.ready:hover #btnPrepare, #viewer.ready:hover #btnClearBox { opacity:1; transition-duration:.35s, .2s, .25s; }
  #viewer.ready #btnPrepare svg { width:14px; height:14px; top:0; }
  #viewer.ready #btnPrepare span { line-height:14px; }
  #viewer.ready #btnPrepare:not(:hover):not(:disabled) { background:rgba(30,32,36,.55); color:#9a9fa8; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); backdrop-filter:blur(6px); }
  #btnClearBox {
    position:absolute; z-index:3; right:12px; top:12px; width:34px; height:34px; padding:0; border:none; background:none;
    color:rgba(255,255,255,.28); display:grid; place-items:center; visibility:hidden; transition:color .2s var(--ease);
    filter:drop-shadow(0 0 2px rgba(0,0,0,.7));
  }
  #btnClearBox:hover { color:var(--yellow); }
  #btnClearBox svg { width:22px; height:22px; }
  #frameLabel {
    position:absolute; z-index:2; left:10px; bottom:36px; color:#fff; font-size:11px; font-weight:500; font-variant-numeric:tabular-nums;
    text-shadow:0 0 3px rgba(0,0,0,.9); pointer-events:none; opacity:0; transition:opacity 1s var(--ease);
  }
  #viewer.ready:hover #frameLabel { opacity:.3; transition-duration:.35s; }

  /* ---------- numbered option rows ---------- */
  .steps { flex:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .steps .pair { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px 44px; }
  .step { display:flex; align-items:center; gap:8px; }
  .step .num { color:#5f646d; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- liquid-glass switches ----------
     Each group of chosen neighbours is one SVG outline: one fill, one rim, no seams (js: Liquid). */
  .seg { position:relative; display:flex; isolation:isolate; }
  .seg-item {
    position:relative; z-index:1; border:none; background:none; height:34px; padding:2px 15px 0; margin:0 -3px; border-radius:17px;
    color:#767b84; font-weight:600; font-size:12px; white-space:nowrap; transition:color .25s;
  }
  .seg-item:hover { color:var(--text); }
  .seg-item.on { color:#fff; }
  .seg svg.liquid { position:absolute; left:0; top:0; z-index:0; pointer-events:none; overflow:visible;
                    filter:drop-shadow(0 4px 6px rgba(0,0,0,var(--shadow))); }
  .liquid .rim { fill:none; stroke-width:1; }
  .liquid .fs0 { stop-color:hsl(var(--h) calc(var(--s) * 1%) 75%); stop-opacity:calc(var(--fb) + var(--fa)); }
  .liquid .fs1 { stop-color:hsl(var(--h) calc(var(--s) * 1%) 72%); stop-opacity:var(--fb); }
  .liquid .rs0 { stop-color:hsl(var(--h) calc(var(--s) * 1%) 90%); stop-opacity:calc(var(--rb) + var(--rtl)); }
  .liquid .rs1 { stop-color:hsl(var(--h) calc(var(--s) * 1%) 88%); stop-opacity:calc(var(--rb) + var(--rte)); }
  .liquid .rs2 { stop-color:hsl(var(--h) calc(var(--s) * 1%) 84%); stop-opacity:var(--rb); }
  .liquid .rs3 { stop-color:hsl(var(--h) calc(var(--s) * 1%) 84%); stop-opacity:calc(var(--rb) + var(--rbr)); }
  /* ---------- viewer ---------- */
  #viewer { flex:1 1 auto; min-height:70px; position:relative; border-radius:var(--r); overflow:hidden; background:#0d0e10; box-shadow:inset 0 0 0 1px var(--line); }
  #canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* frame strip: inside the viewer, shown while the pointer is over it */
  #strip {
    position:absolute; z-index:2; left:0; right:0; bottom:0; width:100%; height:34px; display:block; cursor:pointer;
    opacity:0; transition:opacity 1s var(--ease); /* fades out slowly */
  }
  #viewer.ready:hover #strip { opacity:1; transition-duration:.35s; }

  #applyRow { flex:none; display:flex; gap:16px; justify-content:center; }
  #applyRow .btn { flex:0 1 232px; padding:10px 12px; }

  /* ---------- status ---------- */
  #statusBar { flex:none; position:relative; display:flex; align-items:center; gap:6px; padding:0 0 0 20px; height:14px; overflow:hidden; }
  #status { flex:1; min-width:0; color:color-mix(in srgb, var(--text) 18%, transparent); overflow:hidden; white-space:nowrap; text-align:center; font-size:10px; line-height:14px; }
  #status.overflow { text-align:left; cursor:grab; -webkit-mask-image:linear-gradient(90deg, transparent, #000 8px, #000 calc(100% - 8px), transparent); }
  #status.overflow.dragging { cursor:grabbing; }
  #statusText { display:inline-block; will-change:transform; padding:0 8px; }
  #status.tip { color:color-mix(in srgb, var(--text) 18%, transparent); }
  #status.ok { color:rgba(79,209,139,.72); } #status.warn { color:var(--warn); } #status.err { color:var(--err); }
  #progress { position:absolute; left:0; top:0; height:2px; width:0; border-radius:2px; background:linear-gradient(90deg, var(--blue), var(--blue-hi)); transition:width .12s; }
  #btnSettings { flex:none; width:14px; height:14px; padding:0; border-radius:7px; border:none; background:transparent; color:#80858e; display:grid; place-items:center; transition:color .2s var(--ease), background-color .2s var(--ease); }
  #btnSettings:hover, #btnSettings.open { color:#fff; background:rgba(255,255,255,.07); }
  #btnSettings svg { width:12px; height:12px; }

  #settings {
    position:fixed; right:10px; bottom:28px; width:min(300px, calc(100vw - 20px)); padding:12px; border-radius:16px;
    background:linear-gradient(160deg, rgba(60,64,72,.55), rgba(30,32,36,.55)); backdrop-filter:blur(18px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.55);
    display:none; z-index:5;
  }
  #settings.open { display:block; }
  #settings h3 { margin:0 0 8px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .gt { /* glass toggle buttons */
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; margin:0 0 6px; padding:8px 12px;
    border:none; border-radius:12px; color:#a7acb4; text-align:left;
    background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.025)); backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(255,255,255,.06);
    transition:color .25s var(--ease), background-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .gt::after { content:""; flex:none; width:8px; height:8px; border-radius:50%; box-shadow:inset 0 0 0 1.5px currentColor; transition:all .25s var(--ease); }
  .gt:hover { color:#fff; }
  .gt.on { color:#fff; background:linear-gradient(160deg, rgba(90,166,255,.30), rgba(47,140,255,.12));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(90,166,255,.35); }
  .gt.on::after { background:var(--blue-hi); box-shadow:0 0 6px var(--blue-hi); }
  .field { display:flex; flex-direction:column; gap:4px; margin-top:8px; color:var(--dim); }
  .field input { background:var(--bg); color:var(--text); border:none; box-shadow:inset 0 0 0 1px var(--line); border-radius:10px; padding:7px 9px; font:inherit; user-select:text; }
</style>
</head>
<body>

  <div id="viewer" data-tip="Drag from a detail to place the box · drag edges to resize · drag empty space to pan · wheel to zoom · double-click to move the box · ← → frames">
    <canvas id="canvas"></canvas>
    <button id="btnPrepare" class="btn blue" data-tip="Render the selected timeline clip and load its frames.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8M12 8v8" stroke-width="2.2"/></svg>
      <span>Prepare clip</span>
    </button>
    <button id="btnClearBox" data-tip="Delete the box and the track.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l.8 12h8.4L17 7"/></svg>
    </button>
    <div id="frameLabel"></div>
    <canvas id="strip" data-tip="Click or drag to scrub. Colors show track confidence; yellow marks the box frame."></canvas>
  </div>

  <div class="steps">
    <div class="pair">
    <div class="step"><span class="num">1.</span><div class="seg" id="propChips">
      <button class="seg-item on" data-prop="p" data-tip="Track and apply position.">Position</button>
      <button class="seg-item on" data-prop="s" data-tip="Track and apply scale (detail getting closer or farther).">Scale</button>
      <button class="seg-item on" data-prop="r" data-tip="Track and apply rotation.">Rotation</button>
    </div></div>
    <div class="step"><span class="num">2.</span><div class="seg" id="keyChips">
      <button class="seg-item" id="chipSmooth" data-tip="Smooth out tracking jitter. Great for graphics, not for stabilization.">Smooth</button>
      <button class="seg-item" id="chipReduce" data-tip="Keep only the keyframes needed for 0.5 px accuracy.">Reduce keys</button>
    </div></div>
    </div>
    <div class="step"><span class="num">3.</span><div class="seg" id="adaptChips">
      <button class="seg-item on" data-adapt="low" data-tip="Refresh the reference only when confidence drops below 80%. Best default.">Adapt &lt; 80%</button>
      <button class="seg-item" data-adapt="always" data-tip="Refresh the reference every frame. For details that change look; may drift.">Adapt always</button>
      <button class="seg-item" data-adapt="never" data-tip="Never refresh the reference. No drift, but may lose a changing detail.">Only fixed</button>
    </div></div>
  </div>
  <div id="applyRow">
    <button id="btnAttach" class="btn blue" data-tip="Make the selected clips follow the tracked point.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 19.5C7.5 19.5 16.5 4.5 4.5 4.5"/><path d="M19.5 17.6l1.9 1.9-1.9 1.9-1.9-1.9z" fill="currentColor" stroke-width="1"/><path d="M4.5 2.6l1.9 1.9-1.9 1.9-1.9-1.9z" fill="currentColor" stroke-width="1"/></svg>
      <span>Apply motion</span>
    </button>
    <button id="btnStabilize" class="btn blue" data-tip="Stabilize the selected clip around the tracked point.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      <span>Apply stabilization</span>
    </button>
  </div>

  <div id="statusBar">
    <div id="progress"></div>
    <div id="status"><span id="statusText">Select a clip in the timeline and click Prepare clip.</span></div>
    <button id="btnSettings" data-tip="Additional settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div id="settings">
    <h3>Additional settings</h3>
    <button class="gt" id="hideOthers" data-tip="Mute other video tracks while rendering.">Hide other video tracks</button>
    <button class="gt" id="ignoreKeys" data-tip="Ignore the clip's transform keyframes while rendering (for re-tracking).">Ignore animated transform</button>
    <label class="field" data-tip="Python used for tracking (needs opencv-python).">Python
      <input type="text" id="python" value="python" spellcheck="false">
    </label>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
