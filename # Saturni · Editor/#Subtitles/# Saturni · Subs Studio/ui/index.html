<!doctype html>
<html lang="en" data-theme="dark" data-subs="studio">
<head>
<meta charset="utf-8">
<title>Saturni · Subs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/mod/debug/debug.css">
<link rel="stylesheet" href="/mod/subs/modes.css">
<link rel="icon" href="/ui/subs.png">
</head>
<body class="booting">
<div class="rsz" id="rsz"><i data-edge="t"></i><i data-edge="b"></i><i data-edge="l"></i><i data-edge="r"></i><i data-edge="tl"></i><i data-edge="tr"></i><i data-edge="bl"></i><i data-edge="br"></i></div>

<header class="topbar" id="topbar">
  <button class="brand" id="brand" data-tip="Menu">
    <span class="brand-mark"><svg viewBox="0 0 24 24"><defs><mask id="satm"><rect width="24" height="24" fill="#fff"/><circle cx="12" cy="12" r="7.3" fill="#000"/></mask><mask id="subl" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><rect x="9.40" y="10.10" width="5.2" height="1.3" rx="0.65" fill="#000"/><rect x="9.40" y="12.60" width="5.2" height="1.3" rx="0.65" fill="#000"/></mask></defs><g transform="rotate(-45 12 12)" mask="url(#satm)" fill="currentColor" stroke="currentColor" stroke-width=".8" stroke-linejoin="round"><polygon points="0.6,12 9.6,9.24 9.6,14.76"/><polygon points="23.4,12 14.4,9.24 14.4,14.76"/></g><circle cx="12" cy="12" r="6" fill="currentColor" mask="url(#subl)"/></svg></span>
    <span class="brand-name"><b>Saturni</b> Subs</span>
  </button>
  <div class="tb-group">
    <button class="tbtn" data-act="open" data-tip="Open subtitles or video · Ctrl+O"><i class="ic" data-ic="folder"></i><span>Open</span></button>
    <button class="tbtn save" id="applyBtn" data-act="apply" data-tip="Save · right-click: Save As"><i class="ic" data-ic="disk"></i><span class="spin"></span><span id="applyLbl">Save All</span><span class="udot"></span></button>
    <span class="tb-gap"></span>
    <button class="tbtn icon" data-act="prev-file" data-tip="Previous file in folder · Ctrl+PgUp"><i class="ic" data-ic="prev"></i></button>
    <div class="crumb" id="crumb"><span class="crumb-name">No file</span></div>
    <button class="tbtn icon" data-act="next-file" data-tip="Next file in folder · Ctrl+PgDn"><i class="ic" data-ic="next"></i></button>
    <span class="tb-gap"></span>
    <button class="tbtn" data-act="find" data-tip="Find · Ctrl+F"><i class="ic" data-ic="search"></i><span>Find</span></button>
    <button class="tbtn" data-act="replace" data-tip="Replace · Ctrl+H"><i class="ic" data-ic="replace"></i><span>Replace</span></button>
  </div>
  <div class="tb-drag" id="tbDrag"></div>
  <div class="tb-group">
    <div class="subs-modes"></div>
    <span class="tb-gap"></span>
    <button class="tbtn" data-act="history" data-tip="Versions, undo apply, revert to original"><i class="ic" data-ic="history"></i><span>History</span></button>
    <button class="tbtn icon" data-act="settings" data-tip="Settings"><i class="ic" data-ic="gear"></i></button>
  </div>
  <div class="wctl" id="wctl">
    <button data-act="win-min" aria-label="Minimize"><svg width="10" height="10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
    <button data-act="win-max" aria-label="Maximize"><svg class="w-max" width="10" height="10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg><svg class="w-rest" width="10" height="10" fill="none" stroke="currentColor"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V.5h7v7h-2"/></svg></button>
    <button data-act="win-close" class="x" aria-label="Close"><svg width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
  </div>
</header>

<div class="findbar" id="findbar" hidden>
  <input id="fFind" placeholder="Find" spellcheck="false">
  <input id="fRepl" placeholder="Replace with" spellcheck="false">
  <label class="chk"><input type="checkbox" id="fCase"> Match case</label>
  <span class="f-cnt" id="fCnt"></span>
  <button class="tbtn icon" data-act="find-prev" data-tip="Previous · Shift+Enter"><i class="ic" data-ic="up"></i></button>
  <button class="tbtn icon" data-act="find-next" data-tip="Next · Enter / Ctrl+F3"><i class="ic" data-ic="down"></i></button>
  <button class="tbtn r-only" data-act="repl-one"><span>Replace</span></button>
  <button class="tbtn r-only" data-act="repl-all"><span>Replace all</span></button>
  <button class="tbtn icon" data-act="find-close" data-tip="Close · Esc"><i class="ic" data-ic="x"></i></button>
</div>

<main class="main" id="main">
  <section class="listpane">
    <div class="lhead"><span>#</span><span>Time</span><span>Wave</span><span class="h-x"><button class="rst all" data-act="reset-marks" data-tip="Reset carets and wave marks in all cues"></button>Text</span><span>Voice edit</span></div>
    <div class="list" id="list" tabindex="0"></div>
    <div class="empty" id="empty">
      <div class="he-ic"><i class="ic" data-ic="folder"></i></div>
      <h2>Open subtitles</h2>
      <p>Drop an .srt or a video here, or press <kbd>Ctrl+O</kbd>.</p>
      <button class="apply" data-act="open"><i class="ic" data-ic="folder"></i><span>Open file</span></button>
    </div>
  </section>
  <div class="split v" data-split="list"></div>
  <section class="rightpane">
    <div class="video-wrap" id="videoWrap">
      <video id="video" preload="auto"></video>
      <div class="sub-ov" id="subOv"></div>
      <img class="sub-img" id="subImg" alt="" hidden>
      <div class="novideo">No video next to this file</div>
    </div>
    <div class="vbar">
      <button class="tbtn icon" data-act="play" data-tip="Play / pause · Ctrl+P, Space"><i class="ic" data-ic="play" id="playIc"></i></button>
      <button class="tbtn icon" data-act="back500" data-tip="−0.5 s · Alt+←"><i class="ic" data-ic="rew"></i></button>
      <button class="tbtn icon" data-act="fwd500" data-tip="+0.5 s · Alt+→"><i class="ic" data-ic="ffw"></i></button>
      <span class="vtime" id="vtime">0:00.000</span>
      <span class="grow"></span>
      <select id="rate" data-tip="Playback speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
    </div>
    <div class="split h" data-split="video"></div>
    <div class="chat" id="chat">
      <div class="chat-h">
        <span class="chat-t">Claude</span>
        <span class="chat-st" id="chatSt"></span>
        <span class="grow"></span>
        <button class="tbtn icon" data-act="chat-new" data-tip="Start a new conversation"><i class="ic" data-ic="plus"></i></button>
        <button class="tbtn icon" data-act="session-dir" data-tip="Open the archive folder of this file"><i class="ic" data-ic="archive"></i></button>
        <select id="model" data-tip="Model for Apply and chat"><option value="opus">Opus</option><option value="sonnet">Sonnet</option></select>
      </div>
      <div class="chat-b" id="chatB"></div>
      <div class="chat-f">
        <textarea id="chatIn" rows="1" placeholder="Message Claude about this file…" spellcheck="false"></textarea>
        <button class="cbtn mic-c" id="chatMic" data-act="chat-mic" data-tip="Dictate"><i class="ic" data-ic="mic"></i></button>
        <button class="cbtn send" id="chatSend" data-act="chat-send" data-tip="Send · Enter"><i class="ic" data-ic="send"></i></button>
      </div>
    </div>
  </section>
</main>

<div class="split h tl-split" data-split="tl"></div>
<footer class="timeline" id="timeline">
  <div class="tl-bar">
    <span class="tl-time" id="tlTime"></span>
    <span class="grow"></span>
    <span class="tl-hint">Click: select · Drag: move · Edge: resize · Alt+edge: roll · Drag on empty: new cue · Ctrl+wheel: zoom</span>
    <button class="tbtn icon" data-act="zoom-out" data-tip="Zoom out"><i class="ic" data-ic="minus"></i></button>
    <button class="tbtn icon" data-act="zoom-in" data-tip="Zoom in"><i class="ic" data-ic="plus"></i></button>
    <button class="tbtn" data-act="zoom-fit" data-tip="Fit selection / whole file"><span>Fit</span></button>
  </div>
  <div class="tl-canvas" id="tlBox">
    <canvas id="tlBase"></canvas>
    <canvas id="tlTop"></canvas>
    <button class="tl-plus" id="tlPlus" data-act="tl-plus" data-tip="Add a subtitle here" hidden><i class="ic" data-ic="plus"></i></button>
  </div>
</footer>

<div class="menu" id="menu" hidden></div>
<div class="modal-veil" id="modal" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="tooltip" id="tooltip"></div>
<div class="dropveil" id="dropVeil"><div class="dv-card"><b>Drop .srt or video</b></div></div>

<script src="/mod/debug/debug.js"></script>
<script src="/mod/subs/modes.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
